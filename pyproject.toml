[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "myositis_cdes"
description = "LinkML representations of myositis common data elements (CDEs) for the International Myositis Assessment and Clinical Studies Group (IMACS)"
authors = [
  {name = "Matthew Diller", email = "matthew.diller@nih.gov"},
]
license = "MIT"
readme = "README.md"
include = ["README.md", "src/myositis_cdes/schema", "project"]

requires-python = ">=3.9,<4.0"

dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.1.24",
]

[tool.poetry]
requires-poetry = ">=2.0"
package-mode = false
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = ">=1.5.2"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry.group.dev.dependencies]
linkml = ">=1.3.5"
mkdocs-material = ">=8.2.8"
mkdocs-mermaid2-plugin = ">=1.1.1"
mkdocs-pymdownx-material-extras = "^2.5.6"
schemasheets = ">=0.1.14"
jupyter = ">=1.0.0"
mknotebooks = ">= 0.8.0"
